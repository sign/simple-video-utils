name: Test


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, PyAV ${{ matrix.pyav }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pyav: "18"
          - python-version: "3.12"
            pyav: "18"
          - python-version: "3.12"
            pyav: "19"
          - python-version: "3.13"
            pyav: "19"

    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffprobe
        run: ffprobe -version

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv pip install ".[dev]" "av==${{ matrix.pyav }}.*"

      - name: Test Code
        run: python -m pytest -n auto --dist loadscope
