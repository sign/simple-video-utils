[project]
name = "simple-video-utils"
description = "Shared utilities for processing videos for sign language."
version = "0.0.8"
authors = [
    { name = "Amit Moryossef", email = "amit@sign.mt" },
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12" # PyAV 19 needs 3.12
dependencies = [
    "av>=19.0.0", # the display matrix in the stream header, without decoding a frame
    "certifi", # HTTPS trust roots when Python has no default CA file (e.g. standalone builds)
    "numpy",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C90", # mccabe complexity
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "PT", # flake8-pytest-style
    "BLE", # flake8-blind-except
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = [
    "tests",
]
